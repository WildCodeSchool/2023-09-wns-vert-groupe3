  docker:
   #  needs: test-e2e
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/minification'
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        run: |
            if [ "${GITHUB_REF}" == "refs/heads/dev" ]; then
               echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            elif [ "${GITHUB_REF}" == "refs/heads/staging" ]; then
               echo "IMAGE_TAG=staging" >> $GITHUB_ENV
            elif [ "${GITHUB_REF}" == "refs/heads/main" ]; then
               echo "IMAGE_TAG=main" >> $GITHUB_ENV
            elif [ "${GITHUB_REF}" == "refs/heads/minification" ]; then
               echo "IMAGE_TAG=minification" >> $GITHUB_ENV
            fi
      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🖥 Build and push frontend
        uses: docker/build-push-action@v4
        with:
          push: true
          context: "{{defaultContext}}:frontend"
          file: "Dockerfile.prod"
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wildrent-front:${{ env.IMAGE_TAG }}
        env:
          IMAGE_TAG: ${{env.IMAGE_TAG}}
      - name: 🗂 Build and push backend
        uses: docker/build-push-action@v4
        with:
          push: true
          context: "{{defaultContext}}:backend"
          file: "Dockerfile.prod"
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wildrent-back:${{ env.IMAGE_TAG }}
        env:
          IMAGE_TAG: ${{env.IMAGE_TAG}}

      - name: 📝 Show Docker images
        run: docker images   